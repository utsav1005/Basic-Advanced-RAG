[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personalized-ai-research-agent"
version = "0.1.0"
description = "Personalized AI Research Agent — Agentic RAG with Ollama"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.2",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "psycopg2-binary>=2.9",
    "tiktoken>=0.8",
    "docling>=2.0",
    "python-multipart>=0.0.12",
    "trafilatura>=1.12",
    "httpx>=0.27",
    "opensearch-py>=2.6",
    "sentence-transformers>=3.0",
    # jina-embeddings-v3 ships its model code on the Hub (trust_remote_code).
    # That code targets the transformers 4.x API: on 5.x it dies with
    # `AttributeError: 'XLMRobertaLoRA' object has no attribute
    # 'all_tied_weights_keys'`. Verified working on 4.57.6. docling-ibm-models
    # (>=4.42) and sentence-transformers (>=4.41) are both satisfied by this pin.
    "transformers>=4.42,<5",
    "einops>=0.8",  # required by the jina-v3 remote code
    "redis>=5.0",
    "gradio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "setuptools>=61.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyright]
extraPaths = ["."]

[tool.mypy]
pythonpath = "."
